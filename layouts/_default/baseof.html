<!DOCTYPE html>
<html lang="de">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">Zum Inhalt springen</a>
{{ partial "header.html" . }}
<main id="main" class="wrap">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>
{{ if .IsHome }}
{{ $calc := resources.Get "js/calculator.js" | minify | fingerprint }}
<script src="{{ $calc.RelPermalink }}" defer></script>
{{ end }}
</body>
</html>
