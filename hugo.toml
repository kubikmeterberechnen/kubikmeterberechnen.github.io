baseURL = "https://kubikmeterberechnen.github.io/"
languageCode = "de"
defaultContentLanguage = "de"
title = "Kubikmeter berechnen"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[frontmatter]
  lastmod = ["lastmod", "date"]

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[sitemap]
  changefreq = "monthly"
  priority = 0.6
  filename = "sitemap.xml"

[params]
  description = "Kubikmeter berechnen mit Online-Rechner, Formeln und Glossar: Volumen in m³ für Quader, Zylinder und Kugel, inklusive Umrechnung in Liter."

[[menus.main]]
  name = "Rechner"
